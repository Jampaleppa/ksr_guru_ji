name: Deploy to Cloudflare Pages

# Manual dispatch only — push deployments run via native Cloudflare Git integration
# (Workers Builds: ksr-guru-ji & Cloudflare Pages). Set CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets before running this workflow manually.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Cloudflare Pages Deploy
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ksr-guru-ji --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
